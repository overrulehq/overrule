name: Overrule Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Module Dependencies
        run: go mod tidy

      - name: Build Overrule CLI Binary
        run: go build -v ./cmd/overrule

      - name: Run Tests & Rule Validations
        run: go test -v -race ./...
